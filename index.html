// Build a claude.ai URL with the prompt pre-loaded in the input box
function claudeUrl(moduleId) {
  const prompt = socratics[moduleId];
  if (!prompt) return 'https://claude.ai/new';
  return `https://claude.ai/new?q=${encodeURIComponent(prompt)}`;
}

// ── Supabase helpers ─────────────────────────────────────────────────────────
// Table schema (run this SQL in your Supabase SQL editor):
//
//   create table public.user_progress (
//     id          uuid primary key default gen_random_uuid(),
//     user_id     uuid not null references auth.users(id) on delete cascade,
//     module_id   text not null,
//     objectives  jsonb not null default '{}',
//     quiz        jsonb,
//     updated_at  timestamptz not null default now(),
//     unique (user_id, module_id)
//   );
//
//   alter table public.user_progress enable row level security;
//
//   create policy "Users manage own progress"
//     on public.user_progress
//     for all
//     using  (auth.uid() = user_id)
//     with check (auth.uid() = user_id);

async function fetchProgress(userId) {
  const { data, error } = await supabase
    .from('user_progress')
    .select('module_id, objectives, quiz')
    .eq('user_id', userId);
  if (error) throw error;
  const map = {};
  (data || []).forEach(row => {
    map[row.module_id] = { objectives: row.objectives || {}, quiz: row.quiz || null };
  });
  return map;
}

async function upsertModuleProgress(userId, moduleId, state) {
  const { error } = await supabase
    .from('user_progress')
    .upsert({
      user_id:    userId,
      module_id:  moduleId,
      objectives: state.objectives || {},
      quiz:       state.quiz || null,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id,module_id' });
  if (error) throw error;
}

    lock:         <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
    zap:          <svg width={size} height={size} viewBox="0 0 24 24" fill={color} stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
    award:        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>,
    x:            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
    mail:         <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>,
    loader:       <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" className="spinner"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
    alertCircle:  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
    externalLink: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
  };
  return icons[name] || null;
};

// ── Login Screen ─────────────────────────────────────────────────────────────
function LoginScreen() {
  const [email,   setEmail]   = useState('');
  const [sent,    setSent]    = useState(false);
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!email.includes('@') || !email.includes('.')) {
      setError('Please enter a valid email address.');
      return;
    }
    setLoading(true);
    setError('');
    // redirectTo must match your Supabase "Site URL" or an entry in "Redirect URLs"
    const { error: authError } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href },
    });
    setLoading(false);
    if (authError) {
      setError(authError.message);
    } else {
      setSent(true);
    }
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#09090f',padding:'24px'}}>
      <div style={{width:'100%',maxWidth:'420px'}} className="fade-in">
        <div style={{textAlign:'center',marginBottom:'40px'}}>
          <div style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:56,height:56,background:'linear-gradient(135deg,#7c3aed,#a855f7)',borderRadius:16,marginBottom:16}}>
            <Icon name="zap" size={28} color="white" />
          </div>
          <h1 style={{fontSize:'1.6rem',fontWeight:800,color:'#e2e0ef',letterSpacing:'-0.5px'}}>From Zero to AI Agent Builder</h1>
          <p style={{color:'#a09cb8',marginTop:8,fontSize:'0.9rem'}}>Sign in to track your progress across all 9 modules</p>
        </div>

        {!sent ? (
          <form onSubmit={handleSubmit} style={{background:'#111118',border:'1px solid #2a2a38',borderRadius:16,padding:28}}>
            <label style={{display:'block',fontSize:'0.8rem',fontWeight:600,color:'#a09cb8',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.06em'}}>
              Email address
            </label>
            <div style={{position:'relative',marginBottom:16}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b6880',pointerEvents:'none'}}>
                <Icon name="mail" size={16} />
              </span>
              <input
                type="email" value={email}
                onChange={e => { setEmail(e.target.value); setError(''); }}
                placeholder="you@example.com"
                disabled={loading}
                style={{width:'100%',background:'#18181f',border:'1px solid #2a2a38',borderRadius:10,padding:'12px 12px 12px 40px',color:'#e2e0ef',fontSize:'0.95rem',outline:'none',transition:'border-color 0.15s'}}
              />
            </div>
            {error && (
              <div style={{display:'flex',alignItems:'center',gap:6,color:'#f87171',fontSize:'0.8rem',marginBottom:12}}>
                <Icon name="alertCircle" size={14} color="#f87171" /> {error}
              </div>
            )}
            <button type="submit" disabled={loading}
              style={{width:'100%',background: loading ? '#4b2a9e' : 'linear-gradient(135deg,#7c3aed,#a855f7)',color:'white',border:'none',borderRadius:10,padding:'13px',fontSize:'0.95rem',fontWeight:700,cursor:loading?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,transition:'opacity 0.2s'}}>
              {loading ? <><Icon name="loader" size={16} color="white" /> Sending…</> : 'Send Magic Link'}
            </button>
            <p style={{color:'#6b6880',fontSize:'0.75rem',textAlign:'center',marginTop:14}}>
              No password needed. We'll send a secure sign-in link to your email.
            </p>
          </form>
        ) : (
          <div style={{background:'#111118',border:'1px solid #2a2a38',borderRadius:16,padding:28,textAlign:'center'}} className="fade-in">
            <div style={{fontSize:'2.5rem',marginBottom:12}}>✉️</div>

              Click the link in your email to be signed in automatically. You can close this tab.
            </p>
            <button onClick={()=>{setSent(false);setEmail('');}}
              style={{marginTop:16,background:'transparent',border:'1px solid #2a2a38',borderRadius:8,padding:'8px 16px',color:'#a09cb8',fontSize:'0.8rem',cursor:'pointer'}}>

        )}

  );
}

// ── Quiz Component ────────────────────────────────────────────────────────────
function Quiz({ module, onComplete, existing }) {
  const [answers,   setAnswers]   = useState(existing?.answers   || {});
  const [submitted, setSubmitted] = useState(existing?.submitted || false);
  const [score,     setScore]     = useState(existing?.score     || 0);

  const handleSubmit = () => {
    let correct = 0;
    module.quiz.forEach((q, i) => { if (answers[i] === q.a) correct++; });
    const s = Math.round((correct / module.quiz.length) * 100);
    setScore(s);
    setSubmitted(true);
    onComplete({ answers, submitted: true, score: s, correct, total: module.quiz.length });
  };

  const allAnswered = module.quiz.every((_, i) => answers[i] !== undefined);
  const passed = score >= 80;

  return (
    <div style={{background:'#0d0d14',borderRadius:12,padding:'20px',marginTop:16}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
        <Icon name="award" size={16} color="#f59e0b" />
        <span style={{fontWeight:700,fontSize:'0.85rem',color:'#f59e0b',textTransform:'uppercase',letterSpacing:'0.06em'}}>Check on Learning</span>
      </div>

      {module.quiz.map((q, qi) => (
        <div key={qi} style={{marginBottom:20}}>
          <p style={{fontSize:'0.88rem',color:'#d4d0e8',fontWeight:600,marginBottom:10,lineHeight:1.5}}>{qi+1}. {q.q}</p>
          {q.opts.map((opt, oi) => {
            const selected  = answers[qi] === oi;
            const isCorrect = oi === q.a;
            let bg = '#18181f', border = '#2a2a38', txtColor = '#a09cb8';
            if (submitted) {
              if (isCorrect)               { bg='#052e16'; border='#16a34a'; txtColor='#4ade80'; }
              else if (selected && !isCorrect) { bg='#2d0a0a'; border='#dc2626'; txtColor='#f87171'; }
            } else if (selected) {
              bg='#1e1040'; border='#7c3aed'; txtColor='#c4b5fd';
            }
            return (
              <div key={oi}
                onClick={() => { if (!submitted) setAnswers({...answers, [qi]: oi}); }}
                style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,border:`1px solid ${border}`,background:bg,marginBottom:6,cursor:submitted?'default':'pointer',transition:'all 0.15s'}}>
                <div style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${border}`,background:selected?border:'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {selected && <div style={{width:8,height:8,borderRadius:'50%',background:'white'}} />}
                </div>
                <span style={{fontSize:'0.83rem',color:txtColor,lineHeight:1.4}}>{opt}</span>
                {submitted && isCorrect && <span style={{marginLeft:'auto'}}><Icon name="check" size={14} color="#4ade80"/></span>}
              </div>
            );
          })}
        </div>
      ))}

      {!submitted ? (
        <button onClick={handleSubmit} disabled={!allAnswered}
          style={{background:allAnswered?'linear-gradient(135deg,#d97706,#f59e0b)':'#2a2a38',color:allAnswered?'white':'#6b6880',border:'none',borderRadius:8,padding:'11px 20px',fontWeight:700,fontSize:'0.85rem',cursor:allAnswered?'pointer':'not-allowed',width:'100%',marginTop:4,transition:'background 0.2s'}}>
          Submit Answers
        </button>
      ) : (
        <div style={{background:passed?'#052e16':'#2d0a0a',border:`1px solid ${passed?'#16a34a':'#dc2626'}`,borderRadius:10,padding:'14px 16px',textAlign:'center'}}>
          <div style={{fontSize:'1.5rem',fontWeight:800,color:passed?'#4ade80':'#f87171'}}>{score}%</div>
          <div style={{fontSize:'0.82rem',color:passed?'#86efac':'#fca5a5',marginTop:2}}>
            {passed
              ? `Great work! You passed with ${score}%.`
              : `You scored ${score}%. Review the objectives and try again.`}
          </div>
          {!passed && (
            <button onClick={()=>{setAnswers({});setSubmitted(false);setScore(0);onComplete(null);}}
              style={{marginTop:10,background:'transparent',border:'1px solid #dc2626',borderRadius:6,padding:'6px 14px',color:'#f87171',fontSize:'0.78rem',cursor:'pointer'}}>
              Retry Quiz
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ── Module Card ───────────────────────────────────────────────────────────────
function ModuleCard({ module, state, onUpdate, isLocked, saving }) {
  const [open, setOpen] = useState(false);

  const checkedObjs = state.objectives || {};
  const objCount    = Object.values(checkedObjs).filter(Boolean).length;
  const objTotal    = module.objectives.length;
  const quizDone    = state.quiz?.submitted;
  const quizPassed  = (state.quiz?.score ?? 0) >= 80;
  const complete    = objCount === objTotal && quizDone && quizPassed;

  const toggleObj = (i) => {
    if (isLocked) return;
    const updated = {...checkedObjs, [i]: !checkedObjs[i]};
    onUpdate({...state, objectives: updated});
  };

  return (
    <div style={{background:'#111118',border:`1px solid ${open ? module.sectionColor : '#2a2a38'}`,borderRadius:12,overflow:'hidden',transition:'border-color 0.2s',opacity:isLocked ? 0.45 : 1}}>
      {/* Header row */}
      <div
        onClick={() => !isLocked && setOpen(!open)}
        style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',cursor:isLocked?'not-allowed':'pointer',userSelect:'none'}}>
        <div style={{width:36,height:36,borderRadius:10,background:complete?'linear-gradient(135deg,#16a34a,#22c55e)':`linear-gradient(135deg,${module.sectionColor},${module.sectionColor}99)`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          {isLocked
            ? <Icon name="lock"  size={16} color="white"/>
            : complete
              ? <Icon name="check" size={18} color="white"/>
              : <span style={{color:'white',fontWeight:800,fontSize:'0.8rem'}}>{module.num}</span>}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span style={{fontWeight:700,fontSize:'0.92rem',color:'#e2e0ef'}}>{module.title}</span>
            <span style={{background:'#1e1b4b',color:'#a5b4fc',fontSize:'0.65rem',padding:'2px 7px',borderRadius:4,fontWeight:600,whiteSpace:'nowrap'}}>{module.tag}</span>
            {complete && <span style={{background:'#052e16',color:'#4ade80',fontSize:'0.65rem',padding:'2px 7px',borderRadius:4,fontWeight:600}}>COMPLETE</span>}
            {saving  && <span style={{color:'#6b6880',fontSize:'0.65rem'}}>saving…</span>}
          </div>
          <div style={{marginTop:5,display:'flex',alignItems:'center',gap:8}}>
            <div style={{flex:1,height:4,background:'#2a2a38',borderRadius:2,overflow:'hidden'}}>
              <div style={{height:'100%',background:module.sectionColor,borderRadius:2,width:`${(objCount/objTotal)*100}%`,transition:'width 0.3s'}}/>
            </div>
            <span style={{fontSize:'0.72rem',color:'#6b6880',whiteSpace:'nowrap'}}>{objCount}/{objTotal}</span>
            {quizDone && (
              <span style={{fontSize:'0.72rem',color:quizPassed?'#4ade80':'#f87171'}}>
                Quiz: {state.quiz.score}%
              </span>
            )}
          </div>
        </div>
        <div style={{color:'#6b6880',transform:open?'rotate(180deg)':'rotate(0deg)',transition:'transform 0.2s',flexShrink:0}}>
          <Icon name="chevronDown" size={18} />
        </div>
      </div>

      {/* Expanded body */}
      {open && (
        <div style={{padding:'0 16px 16px',borderTop:'1px solid #1e1e28'}} className="fade-in">
          {/* Objectives */}
          <div style={{marginTop:14}}>
            <p style={{fontSize:'0.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:module.sectionColor,marginBottom:8}}>
              Learning Objectives
            </p>
            {module.objectives.map((obj, i) => (
              <div key={i} onClick={() => toggleObj(i)}
                style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:8,cursor:'pointer',padding:'6px 8px',borderRadius:8,background:checkedObjs[i]?'#0d1a0d':'transparent',transition:'background 0.15s'}}>
                <div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${checkedObjs[i]?'#22c55e':module.sectionColor}`,background:checkedObjs[i]?'#22c55e':'transparent',flexShrink:0,marginTop:1,display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.2s'}}>
                  {checkedObjs[i] && <Icon name="check" size={11} color="white"/>}
                </div>
                <span style={{fontSize:'0.83rem',color:checkedObjs[i]?'#6b7280':'#d1d5db',textDecoration:checkedObjs[i]?'line-through':'none',lineHeight:1.5}}>{obj}</span>
              </div>
            ))}
          </div>

          {/* Exercise */}
          <div style={{background:'#0d0d14',borderLeft:'3px solid #f59e0b',borderRadius:'0 8px 8px 0',padding:'12px 14px',marginTop:14}}>
            <p style={{fontSize:'0.7rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:'#f59e0b',marginBottom:5}}>⚡ Practical Exercise</p>
            <p style={{fontSize:'0.83rem',color:'#d1d5db',lineHeight:1.55}}>{module.exercise}</p>
          </div>

          {/* Study with Claude */}
          <a
            href={claudeUrl(module.id)}
            target="_blank"
            rel="noopener noreferrer"
            style={{
              display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              marginTop:14, padding:'12px 16px',
              background:`linear-gradient(135deg,${module.sectionColor}22,${module.sectionColor}11)`,
              border:`1px solid ${module.sectionColor}55`,
              borderRadius:10, textDecoration:'none',
              color: module.sectionColor,
              fontWeight:700, fontSize:'0.85rem',
              transition:'all 0.15s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background=`linear-gradient(135deg,${module.sectionColor}33,${module.sectionColor}22)`; }}
            onMouseLeave={e => { e.currentTarget.style.background=`linear-gradient(135deg,${module.sectionColor}22,${module.sectionColor}11)`; }}
          >
            <Icon name="externalLink" size={15} color={module.sectionColor} />
            Study this module with Claude
            <span style={{fontSize:'0.72rem',fontWeight:400,opacity:0.7,marginLeft:2}}>→ opens in your Claude account</span>
          </a>

          {/* Quiz */}
          <Quiz
            module={module}
            existing={state.quiz}
            onComplete={(quizState) => onUpdate({...state, quiz: quizState})}
          />
        </div>
      )}
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({ user, progress, onProgressUpdate, onLogout }) {
  // Derive stats
  const totalObjs    = allModules.reduce((s, m) => s + m.objectives.length, 0);
  const doneObjs     = allModules.reduce((s, m) => s + Object.values(progress[m.id]?.objectives || {}).filter(Boolean).length, 0);
  const quizzesPassed  = allModules.filter(m => (progress[m.id]?.quiz?.score ?? 0) >= 80).length;
  const completedMods  = allModules.filter(m => {
    const st = progress[m.id] || {};
    return Object.values(st.objectives||{}).filter(Boolean).length === m.objectives.length
      && (st.quiz?.score ?? 0) >= 80;
  }).length;
  const overallPct = Math.round(
    ((doneObjs / totalObjs) * 0.6 + (quizzesPassed / allModules.length) * 0.4) * 100
  );

  // Per-module save state (for "saving…" indicator)
  const [savingMap, setSavingMap] = useState({});
  const [saveError, setSaveError] = useState(false);

  const handleUpdate = useCallback(async (moduleId, newState) => {
    // Optimistic update in parent immediately
    onProgressUpdate(moduleId, newState);
    // Write to Supabase
    setSavingMap(prev => ({...prev, [moduleId]: true}));
    try {
      await upsertModuleProgress(user.id, moduleId, newState);
    } catch (err) {
      console.error('Failed to save progress:', err);
      setSaveError(true);
      setTimeout(() => setSaveError(false), 4000);
    } finally {
      setSavingMap(prev => ({...prev, [moduleId]: false}));
    }
  }, [user.id, onProgressUpdate]);

  // Helper: is a module completed?
  const isModComplete = (mod) => {
    const st = progress[mod.id] || {};
    return Object.values(st.objectives||{}).filter(Boolean).length === mod.objectives.length
      && (st.quiz?.score ?? 0) >= 80;
  };

  return (
    <div style={{maxWidth:760, margin:'0 auto', padding:'24px 16px'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:28}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:40,height:40,background:'linear-gradient(135deg,#7c3aed,#a855f7)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Icon name="zap" size={20} color="white" />
          </div>
          <div>
            <h1 style={{fontSize:'1.1rem',fontWeight:800,color:'#e2e0ef',letterSpacing:'-0.3px'}}>From Zero to AI Agent Builder</h1>
            <p style={{fontSize:'0.75rem',color:'#6b6880'}}>{user.email}</p>
          </div>
        </div>
        <button onClick={onLogout}
          style={{background:'#18181f',border:'1px solid #2a2a38',borderRadius:8,padding:'7px 12px',color:'#a09cb8',fontSize:'0.78rem',cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
          <Icon name="x" size={13}/> Sign out
        </button>
      </div>

      {/* Stats row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:24}}>
        {[
          {label:'Overall Progress',  val:`${overallPct}%`,                  color:'#a78bfa'},
          {label:'Objectives Done',   val:`${doneObjs}/${totalObjs}`,        color:'#34d399'},
          {label:'Quizzes Passed',    val:`${quizzesPassed}/${allModules.length}`, color:'#f59e0b'},
          {label:'Modules Complete',  val:`${completedMods}/${allModules.length}`, color:'#60a5fa'},
        ].map(s => (
          <div key={s.label} style={{background:'#111118',border:'1px solid #2a2a38',borderRadius:10,padding:'12px 14px',textAlign:'center'}}>
            <div style={{fontSize:'1.3rem',fontWeight:800,color:s.color}}>{s.val}</div>
            <div style={{fontSize:'0.68rem',color:'#6b6880',marginTop:3,lineHeight:1.3}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Overall progress bar */}
      <div style={{marginBottom:28}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:'0.75rem',color:'#a09cb8',fontWeight:600}}>Course Progress</span>
          <span style={{fontSize:'0.75rem',color:'#a09cb8'}}>{overallPct}%</span>
        </div>
        <div style={{height:8,background:'#1e1e28',borderRadius:4,overflow:'hidden'}}>
          <div style={{height:'100%',background:'linear-gradient(90deg,#7c3aed,#a855f7,#0891b2)',borderRadius:4,width:`${overallPct}%`,transition:'width 0.5s ease'}}/>
        </div>
      </div>

      {/* Sections */}
      {sections.map((section, si) => {
        // Previous section is fully complete?
        const prevSectionComplete = si === 0 || sections[si-1].modules.every(isModComplete);

        return (
          <div key={section.id} style={{marginBottom:28}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
              <div style={{height:3,width:24,background:section.color,borderRadius:2}}/>
              <h2 style={{fontSize:'0.85rem',fontWeight:700,color:section.color,textTransform:'uppercase',letterSpacing:'0.06em'}}>{section.title}</h2>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {section.modules.map((mod, mi) => {
                // A module is locked unless every predecessor is done.
                // First module of first section: always unlocked.
                // First module of subsequent sections: locked until prev section done.
                // Any non-first module: locked until the one before it is done.
                let isLocked = false;
                if (si === 0 && mi === 0) {
                  isLocked = false;
                } else if (mi === 0) {
                  isLocked = !prevSectionComplete;
                } else {
                  isLocked = !isModComplete(section.modules[mi - 1]);
                }

                return (
                  <ModuleCard
                    key={mod.id}
                    module={mod}
                    state={progress[mod.id] || {}}
                    isLocked={isLocked}
                    saving={!!savingMap[mod.id]}
                    onUpdate={(newState) => handleUpdate(mod.id, newState)}
                  />
                );
              })}
            </div>
          </div>
        );
      })}

      {/* Save error toast */}
      {saveError && (
        <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',background:'#2d0a0a',border:'1px solid #dc2626',borderRadius:10,padding:'12px 20px',display:'flex',alignItems:'center',gap:8,zIndex:999,boxShadow:'0 4px 24px #0008'}} className="fade-in">
          <Icon name="alertCircle" size={15} color="#f87171" />
          <span style={{fontSize:'0.83rem',color:'#f87171'}}>Progress didn't save — check your connection and try again.</span>
        </div>
      )}

      {/* Completion banner */}
      {completedMods === allModules.length && (
        <div style={{background:'linear-gradient(135deg,#1a1030,#0f1a20)',border:'1px solid #7c3aed',borderRadius:16,padding:28,textAlign:'center',marginTop:8}} className="fade-in">
          <Icon name="award" size={40} color="#f59e0b" />
          <h2 style={{fontSize:'1.3rem',fontWeight:800,color:'#e2e0ef',margin:'12px 0 8px'}}>Course Complete!</h2>
          <p style={{color:'#a09cb8',fontSize:'0.88rem'}}>You've gone from zero to AI agent builder. Time to put these skills to work.</p>
        </div>
      )}
    </div>
  );
}

// ── Loading Screen ────────────────────────────────────────────────────────────
function LoadingScreen({ message = 'Loading…' }) {
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#09090f',gap:16}}>
      <Icon name="loader" size={32} color="#7c3aed" />
      <p style={{color:'#6b6880',fontSize:'0.85rem'}}>{message}</p>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [authState, setAuthState] = useState('loading'); // 'loading' | 'unauthenticated' | 'authenticated'
  const [user,      setUser]      = useState(null);
  const [progress,  setProgress]  = useState({});
  const [loadingMsg, setLoadingMsg] = useState('Checking session…');

  // Bootstrap: check existing session, then listen for auth changes
  useEffect(() => {
    let mounted = true;

    const bootstrap = async () => {
      // getSession() reads from local storage / cookie set by Supabase
      const { data: { session } } = await supabase.auth.getSession();
      if (!mounted) return;

      if (session?.user) {
        setUser(session.user);
        setLoadingMsg('Loading your progress…');
        try {
          const prog = await fetchProgress(session.user.id);
          if (mounted) setProgress(prog);
        } catch (e) {
          console.error('Could not load progress:', e);
        }
        if (mounted) setAuthState('authenticated');
      } else {
        if (mounted) setAuthState('unauthenticated');
      }
    };

    bootstrap();

    // onAuthStateChange fires on magic-link callback, sign-out, token refresh, etc.
    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
      if (!mounted) return;

      if (event === 'SIGNED_IN' && session?.user) {
        setUser(session.user);
        setLoadingMsg('Loading your progress…');
        setAuthState('loading');
        try {
          const prog = await fetchProgress(session.user.id);
          if (mounted) setProgress(prog);
        } catch (e) {
          console.error('Could not load progress:', e);
        }
        if (mounted) setAuthState('authenticated');
      }

      if (event === 'SIGNED_OUT') {
        if (mounted) {
          setUser(null);
          setProgress({});
          setAuthState('unauthenticated');
        }
      }
    });

    return () => {
      mounted = false;
      subscription.unsubscribe();
    };
  }, []);

  const handleProgressUpdate = useCallback((moduleId, newState) => {
    setProgress(prev => ({...prev, [moduleId]: newState}));
  }, []);

  const handleLogout = async () => {
    await supabase.auth.signOut();
    // onAuthStateChange will handle the state update
  };

  if (authState === 'loading') return <LoadingScreen message={loadingMsg} />;
  if (authState === 'unauthenticated') return <LoginScreen />;

  return (
    <Dashboard
      user={user}
      progress={progress}
      onProgressUpdate={handleProgressUpdate}
      onLogout={handleLogout}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
